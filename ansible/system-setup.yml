---
- name: Provision developer desktop  # noqa: role-name[path]
  hosts: localhost
  vars:
    user: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    user_home: "{{ ansible_facts['env']['HOME'] }}"
    # The desktop's human owner, pinned rather than runner-derived. ~/work and the
    # bot's ACL grants must resolve to the human even on a run made as the 'claude'
    # bot; keyed off the runner, ownership flips to whoever ran the play. See
    # git/git_tools and the claude_user role.
    primary_user: dan
    primary_group: dan
    primary_home: "/home/{{ primary_user }}"
  roles:
    - docker
    - dot_files
    # git sub-roles are intentionally grouped under 'roles/git/' (see the
    # play-level 'noqa: role-name[path]' above, which the path-based names trip)
    - git/gh_command
    - git/local_config
    - git/git_tools
    - git/scm_breeze
    - gnome
    - clipboard
    - grub
    - intellij
    - { role: host_blocking, tags: host_blocking }
    - linux
    - { role: claude_user, tags: claude_user }
