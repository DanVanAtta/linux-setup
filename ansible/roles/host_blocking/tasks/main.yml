---
- name: Ensure git is installed
  become: true
  ansible.builtin.package:
    name: git
    state: present

- name: Clone or pull StevenBlack hosts repo
  ansible.builtin.git:
    repo: https://github.com/StevenBlack/hosts.git
    dest: "{{ user_home }}/.stevenblack-hosts"
    version: master
    update: true
    depth: 1
  register: host_blocking_git_result

- name: Get hostname
  ansible.builtin.command: hostname
  register: host_blocking_hostname_output
  changed_when: false

# The write must follow the repo pull in-line (it consumes the freshly pulled
# hosts file), so this stays a change-gated task rather than a deferred handler.
- name: Write /etc/hosts from repo with local hostname prepended
  become: true
  ansible.builtin.template:
    src: stevenblack_hosts.j2
    dest: /etc/hosts
    mode: "0644"
  vars:
    local_hostname: "{{ host_blocking_hostname_output.stdout }}"
  when: host_blocking_git_result.changed  # noqa: no-handler
