---
# The isolated, low-privilege user the Claude Code bot runs as.
claude_user_name: claude
claude_user_home: "/home/{{ claude_user_name }}"
claude_user_model: claude-opus-4-8

# Resource ceilings for the bot user (see the "Bound the bot user's resource
# limits" task). A safety net against a runaway/wedged bot exhausting the box
# and dragging the human's session down with it — not a tight sandbox. Keep
# nproc generous: RLIMIT_NPROC counts threads on Linux and a parallel JVM build
# spawns thousands, so a low cap breaks real builds. Tune to the heaviest
# workload run here; the machine's uncapped baseline is far higher (nproc ~248k).
claude_user_limit_nproc: 16384
claude_user_limit_nofile: 65536

# The primary (human) user whose files the bot is granted narrow access to.
# Pinned to the human (set in system-setup.yml), not the runner, so a run made as
# the bot still resolves these grants to the human's home rather than its own.
claude_user_primary: "{{ primary_user }}"
claude_user_primary_home: "{{ primary_home }}"
claude_user_work_dir: "{{ user_home }}/work"
# Read-only opt-in: the bot may read pasted/referenced screenshots but never
# writes here (unlike the read-write ~/work grant).
claude_user_screenshots_dir: "{{ user_home }}/Screenshots"

# Clipboard paste (see README "Clipboard access"): the bot's paste reads the X
# clipboard via 'xsel', which needs the graphical session's Xwayland cookie. The
# autostart hook copies that cookie here, ACL-readable by the bot, and the launch
# wrapper points XAUTHORITY at it. Trades a slice of isolation — the bot can read
# the live clipboard — for working paste; keep them together.
claude_user_display: ":0"
claude_user_xauth_file: "{{ user_home }}/.claude-bot-xauth"

# Rootless container engine (see README "Container builds"): the bot builds and
# runs containers with Podman inside its own user namespace, so a breakout is
# only ever the low-privilege 'claude' user, never host root. The human's rootful
# Docker (the 'docker' role) is deliberately withheld — docker-group / socket
# access is root-equivalent and would dissolve this whole boundary. These map the
# container uid/gid space onto a subordinate range the bot owns; container 'root'
# becomes {{ claude_user_subid_start }}.
claude_user_subid_start: 165536
claude_user_subid_count: 65536

# The bot's own git identity — kept distinct so its commits are attributable to
# the bot, not the human. The +ghbot address routes to a dedicated GitHub
# account. The bot signs its commits with its own SSH key (never the human's) so
# GitHub marks them Verified; see claude_user_git_signing_key.
claude_user_git_name: "DanVanAtta[Bot]"
claude_user_git_email: "dhvatta+ghbot@gmail.com"

# The bot's SSH commit-signing key: a no-passphrase ed25519 key (headless signing
# can't prompt) under the bot's ~/.ssh, placed out of band like the read-only SSH
# key — no second secret in the repo — so signing is config only and the key is
# not created by `make apply`. The value is the private key path; the '.pub'
# beside it is what git signs with and what's uploaded to GitHub as a signing key.
claude_user_git_signing_key: "{{ claude_user_home }}/.ssh/git-signing-ed25519"
