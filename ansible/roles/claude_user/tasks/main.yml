---
# Runs the Claude Code bot under a dedicated, low-privilege '{{ claude_user_name }}'
# Unix user. Access to the primary user's files is a strict opt-in allowlist via
# POSIX ACLs (read-write ~/work, read-only ~/Screenshots), so a bot running
# --dangerously-skip-permissions can never read ~/.ssh or any other secret it
# was not explicitly granted. The kernel
# enforces this — unlike the in-process sandbox, the bot cannot relax it. See
# README.md for the full model and its known tradeoffs.

- name: Ensure setfacl is available for ACL-based access control
  become: true
  ansible.builtin.package:
    name: acl
    state: present

- name: Create the isolated bot user (own home, no sudo, no direct login)
  become: true
  ansible.builtin.user:
    name: "{{ claude_user_name }}"
    home: "{{ claude_user_home }}"
    shell: /bin/bash
    create_home: true
    password_lock: true

# --- Resource limits (anti-runaway) -----------------------------------------
# Bound what a runaway or wedged bot can consume so it cannot DoS the human's
# own session — a fork storm or fd leak is capped at the 'claude' user, leaving
# the rest of the machine headroom. Applied via pam_limits, which sudo's PAM
# session stack honours, so `sudo -u {{ claude_user_name }}` launches inherit it.
# Not a syscall sandbox; see README "Hardening knobs deliberately not set" for
# what is (and isn't) enforced and why.

- name: Bound the bot user's resource limits (nproc, nofile)
  become: true
  ansible.builtin.template:
    src: claude-limits.conf.j2
    dest: /etc/security/limits.d/claude.conf
    owner: root
    group: root
    mode: "0644"

# --- Opt-in file access via POSIX ACLs --------------------------------------

- name: Ensure the screenshots dir exists so the read-only grant has a target
  # The bot reads pasted/referenced screenshots from here. Created if absent (a
  # fresh machine may not have taken one yet) so the ACL tasks below never fail
  # on a missing path; owned by the human, never the bot.
  become: true
  ansible.builtin.file:
    path: "{{ claude_user_screenshots_dir }}"
    state: directory
    owner: "{{ claude_user_primary }}"
    group: "{{ claude_user_primary }}"
    mode: "0750"

- name: Read current ACLs on the shared paths
  become: true
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: "getfacl -pc {{ item }}"
  changed_when: false
  register: claude_user_acls
  loop:
    - "{{ claude_user_primary_home }}"
    - "{{ claude_user_work_dir }}"
    - "{{ claude_user_screenshots_dir }}"

- name: Grant the bot traverse-only access into the primary home
  # -x lets the bot cd through {{ claude_user_primary_home }} to reach ~/work. It
  # cannot list the home, but traverse alone still lets it read any world-readable
  # file there by exact path — the home's 0750 mode does not protect them. The
  # next task strips that exposure.
  become: true
  when: not ansible_check_mode and ('user:' + claude_user_name + ':') not in (claude_user_acls.results[0].stdout | default(''))
  ansible.builtin.command:
    cmd: "setfacl -m u:{{ claude_user_name }}:x {{ claude_user_primary_home }}"
  changed_when: true

- name: Strip world access from the primary home so traverse exposes nothing
  # Remove all "other" access from every top-level entry except ~/work (the one
  # thing the bot is meant to reach), so no secret sitting in the home — dotfiles
  # with exported tokens, key files, dumps — is readable through the traverse
  # grant above. Runs as root so it also covers root-owned entries.
  become: true
  when: not ansible_check_mode
  ansible.builtin.shell: >-
    find {{ claude_user_primary_home }} -mindepth 1 -maxdepth 1
    ! -name {{ claude_user_work_dir | basename }}
    \( -type f -o -type d \) -exec chmod o-rwx {} +
  changed_when: false

- name: Grant the bot (and keep the primary user) rwX on ~/work, recursively
  become: true
  when: not ansible_check_mode and ('default:user:' + claude_user_name + ':') not in (claude_user_acls.results[1].stdout | default(''))
  ansible.builtin.command:
    cmd: "setfacl -R -m u:{{ claude_user_name }}:rwX,u:{{ claude_user_primary }}:rwX {{ claude_user_work_dir }}"
  changed_when: true

- name: Set default ACLs so new files under ~/work inherit that shared access
  # Keeps files editable both directions: bot-created files stay writable by the
  # primary user, and vice versa, without a shared group or setgid churn.
  become: true
  when: not ansible_check_mode and ('default:user:' + claude_user_name + ':') not in (claude_user_acls.results[1].stdout | default(''))
  ansible.builtin.command:
    cmd: "setfacl -R -d -m u:{{ claude_user_name }}:rwX,u:{{ claude_user_primary }}:rwX {{ claude_user_work_dir }}"
  changed_when: true

- name: Grant the bot read-only access to ~/Screenshots, recursively
  # Read-only (rX), unlike the rwX on ~/work: the bot reads screenshots the human
  # pastes or references but never writes here. X adds traverse on the dir (and
  # any subdirs) without making plain image files executable.
  become: true
  when: not ansible_check_mode and ('default:user:' + claude_user_name + ':') not in (claude_user_acls.results[2].stdout | default(''))
  ansible.builtin.command:
    cmd: "setfacl -R -m u:{{ claude_user_name }}:rX {{ claude_user_screenshots_dir }}"
  changed_when: true

- name: Set default ACLs so new screenshots inherit the bot's read access
  # A new screenshot dropped in later is readable by the bot without a re-run;
  # the default entry applies to files created after this point.
  become: true
  when: not ansible_check_mode and ('default:user:' + claude_user_name + ':') not in (claude_user_acls.results[2].stdout | default(''))
  ansible.builtin.command:
    cmd: "setfacl -R -d -m u:{{ claude_user_name }}:rX {{ claude_user_screenshots_dir }}"
  changed_when: true

- name: Give the bot a ~/work that resolves to the shared checkout
  # The bot's HOME is {{ claude_user_home }}, but the shared tree lives under the
  # primary home; hooks and tools expand $HOME/work, so this symlink makes
  # ~/work resolve correctly for the bot (eg: the worktree-create hook).
  become: true
  ansible.builtin.file:
    src: "{{ claude_user_work_dir }}"
    dest: "{{ claude_user_home }}/work"
    state: link
    owner: "{{ claude_user_name }}"
    group: "{{ claude_user_name }}"
    force: true

# --- Bot SSH directory -------------------------------------------------------

- name: Ensure the bot's ~/.ssh exists with SSH-strict ownership and mode
  # ssh refuses a private key unless its directory is owned by the bot and
  # unreadable to group/other; 0700 + claude ownership satisfies that check.
  # Only the directory is managed here — no key is deployed; keys are placed
  # out of band.
  become: true
  ansible.builtin.file:
    path: "{{ claude_user_home }}/.ssh"
    state: directory
    owner: "{{ claude_user_name }}"
    group: "{{ claude_user_name }}"
    mode: "0700"

# --- Claude Code install for the bot ----------------------------------------

- name: Ensure the bot's ~/.local/{bin,share} exist
  become: true
  ansible.builtin.file:
    path: "{{ claude_user_home }}/.local/{{ item }}"
    state: directory
    owner: "{{ claude_user_name }}"
    group: "{{ claude_user_name }}"
    mode: "0755"
  loop:
    - bin
    - share

- name: Copy the bot's Claude versions from the primary user's install
  # Copying the already-working native install is offline and version-exact;
  # the bot's own auto-updater takes over from here into ~/.local/share/claude.
  become: true
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: "cp -a {{ claude_user_primary_home }}/.local/share/claude {{ claude_user_home }}/.local/share/"
    creates: "{{ claude_user_home }}/.local/share/claude/versions"

- name: Give the bot ownership of its copied Claude versions
  become: true
  when: not ansible_check_mode
  ansible.builtin.file:
    path: "{{ claude_user_home }}/.local/share/claude"
    state: directory
    owner: "{{ claude_user_name }}"
    group: "{{ claude_user_name }}"
    recurse: true

- name: Read the primary user's claude launcher target
  become: true
  ansible.builtin.stat:
    path: "{{ claude_user_primary_home }}/.local/bin/claude"
  register: claude_user_launcher

- name: Point the bot's claude launcher at its own copied version
  # The primary launcher is an absolute symlink into the primary home; copying
  # it verbatim would send the bot back into that home (and its ACL-blocked
  # install). Recreate it against the bot's own copy instead.
  become: true
  when: claude_user_launcher.stat.islnk | default(false)
  ansible.builtin.file:
    src: "{{ claude_user_launcher.stat.lnk_target | replace(claude_user_primary_home, claude_user_home) }}"
    dest: "{{ claude_user_home }}/.local/bin/claude"
    state: link
    owner: "{{ claude_user_name }}"
    group: "{{ claude_user_name }}"
    force: true

- name: Deploy the bot's launch wrapper that loads env sudo's reset drops
  # sudo runs this (not the binary) so the bot's own env — GH tokens, PATH — is
  # loaded at the launch point every child shell inherits; a headless bot's
  # shells read no dotfile. A distinct path from the '.local/bin/claude' launcher
  # above so a bot self-update can't clobber it. See claude-bot-launch.sh.j2.
  become: true
  ansible.builtin.template:
    src: claude-bot-launch.sh.j2
    dest: "{{ claude_user_home }}/.local/bin/claude-bot"
    owner: "{{ claude_user_name }}"
    group: "{{ claude_user_name }}"
    mode: "0755"

# --- Ansible toolchain for the bot -------------------------------------------
# The bot works in this linux-setup repo, so it needs its own ansible toolchain;
# the isolation ACLs wall it off from the primary user's uv tools under the human
# home. Mirrors the justfile 'setup' recipe (pipx -> uv -> uv tool install) into
# the bot's own ~/.local — the one PATH the launch wrapper prepends. Each install
# is guarded to run once — a creates check for the single-binary tools, an import
# probe for ansible-core (see below) — so `make apply` stays idempotent; the human
# still drives routine version bumps through `just setup`.

- name: Ensure pipx is available to bootstrap the bot's uv
  become: true
  ansible.builtin.package:
    name: pipx
    state: present

- name: Install uv for the bot via pipx
  become: true
  become_user: "{{ claude_user_name }}"
  community.general.pipx:
    name: uv
    state: present

# ansible-core plus the runtime libs the 'setup' recipe pins
# (linode_api4/passlib/netaddr/jmespath); linode_api4 backs the dynamic Linode
# inventory the bot uses to resolve production IPs. A bare `uv tool install`
# short-circuits once ansible-core exists and will not add a --with lib listed
# later, so a tool env built before linode_api4 was added never picks it up.
# Probe the import and (re)install only when a lib is missing: fires on a fresh
# machine and to repair that drift, but stays a no-op on a healthy env — so
# `make apply` is idempotent and routine version bumps remain the human's call
# via `just setup`.
- name: Check whether the bot's ansible env has its inventory runtime libs
  become: true
  become_user: "{{ claude_user_name }}"
  when: not ansible_check_mode
  ansible.builtin.command:
    argv:
      - "{{ claude_user_home }}/.local/bin/uv"
      - tool
      - run
      - --from
      - ansible-core
      - python
      - -c
      - import linode_api4
  register: claude_user_ansible_libs
  changed_when: false
  failed_when: false

- name: Install the bot's ansible-core with its playbook runtime libs
  become: true
  become_user: "{{ claude_user_name }}"
  when: not ansible_check_mode and (claude_user_ansible_libs.rc | default(1)) != 0
  ansible.builtin.command:
    cmd: >-
      {{ claude_user_home }}/.local/bin/uv tool install --upgrade ansible-core
      --with ansible --with linode_api4 --with passlib
      --with netaddr --with jmespath
  changed_when: true

- name: Install the bot's ansible-lint
  become: true
  become_user: "{{ claude_user_name }}"
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: "{{ claude_user_home }}/.local/bin/uv tool install ansible-lint"
    creates: "{{ claude_user_home }}/.local/bin/ansible-lint"

- name: Install the bot's ansible-navigator
  become: true
  become_user: "{{ claude_user_name }}"
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: "{{ claude_user_home }}/.local/bin/uv tool install ansible-navigator"
    creates: "{{ claude_user_home }}/.local/bin/ansible-navigator"

- name: Install the bot's required ansible collections
  # Mirrors the 'galaxy' recipe: syntax-check and lint of this repo resolve
  # community.general FQCNs, so the bot needs the collection present to run
  # `just check`/`verify` in its own home.
  become: true
  become_user: "{{ claude_user_name }}"
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: >-
      {{ claude_user_home }}/.local/bin/ansible-galaxy collection install
      -r {{ playbook_dir }}/requirements.yml
    creates: "{{ claude_user_home }}/.ansible/collections/ansible_collections/community/general"

# --- Bot git identity --------------------------------------------------------

- name: Set the bot's own git identity and credential store
  become: true
  become_user: "{{ claude_user_name }}"
  community.general.git_config:
    scope: global
    name: "{{ item.name }}"
    value: "{{ item.value }}"
  loop:
    - { name: user.name, value: "{{ claude_user_git_name }}" }
    - { name: user.email, value: "{{ claude_user_git_email }}" }
    # git reads the bot's own token from ~/.git-credentials (deployed below).
    - { name: credential.helper, value: store }

- name: Let the bot run git in the human's shared repos (safe.directory)
  # The ~/work checkout and its clones are owned by the human, but git here runs
  # as the bot; git's ownership check then refuses every repo with "detected
  # dubious ownership". Scope the exception to the shared work tree only — the
  # trailing '/*' matches repos at any depth under it — rather than a blanket
  # '*', so the bot is not told to trust repositories anywhere else on disk.
  become: true
  become_user: "{{ claude_user_name }}"
  community.general.git_config:
    scope: global
    name: safe.directory
    value: "{{ claude_user_work_dir }}/*"

# --- Bot commit signing (SSH) ------------------------------------------------
# The bot signs its commits with its own SSH key so GitHub shows them Verified
# against the bot account. The key lives out of band under the bot's ~/.ssh (the
# same "no second secret in the repo" call as the read-only SSH key), so this is
# config only — a bare `make apply` does not create it. Every task here is gated
# on the private key being present: an apply run before the key is placed must
# not set commit.gpgsign, which would make every bot commit fail with no key to
# sign with. SSH signing (not GPG) to avoid a gpg-agent/keyring in a headless,
# non-interactive process.

- name: Check whether the bot's SSH signing key is present
  become: true
  become_user: "{{ claude_user_name }}"
  ansible.builtin.stat:
    path: "{{ claude_user_git_signing_key }}"
  register: claude_user_signing_key

- name: Turn on SSH commit signing once the key is present
  become: true
  become_user: "{{ claude_user_name }}"
  when: claude_user_signing_key.stat.exists | default(false)
  community.general.git_config:
    scope: global
    name: "{{ item.name }}"
    value: "{{ item.value }}"
  loop:
    - { name: gpg.format, value: ssh }
    - { name: user.signingkey, value: "{{ claude_user_git_signing_key }}.pub" }
    - { name: commit.gpgsign, value: "true" }
    - { name: gpg.ssh.allowedSignersFile, value: "{{ claude_user_home }}/.ssh/allowed_signers" }

- name: Read the signing public key for the allowed-signers file
  become: true
  become_user: "{{ claude_user_name }}"
  when: claude_user_signing_key.stat.exists | default(false)
  ansible.builtin.slurp:
    src: "{{ claude_user_git_signing_key }}.pub"
  register: claude_user_signing_pubkey

- name: Deploy the allowed-signers file so the bot can verify its own signatures
  # Feeds only local `git log --show-signature`; GitHub's Verified badge does not
  # use it. Binds the bot's committer email to its signing key (keytype + key
  # only, dropping the .pub comment field the allowed_signers format rejects).
  become: true
  become_user: "{{ claude_user_name }}"
  when: claude_user_signing_key.stat.exists | default(false)
  ansible.builtin.copy:
    dest: "{{ claude_user_home }}/.ssh/allowed_signers"
    owner: "{{ claude_user_name }}"
    group: "{{ claude_user_name }}"
    mode: "0644"
    content: "{{ claude_user_git_email }} {{ (claude_user_signing_pubkey.content | b64decode).split(' ')[:2] | join(' ') }}\n"

# --- Bot GitHub token (vaulted -> deployed to the bot's home) ----------------

- name: Deploy the bot's API tokens as an environment file
  # Mirrors the primary user's ~/.pat_tokens pattern: a 0600 file the launch
  # wrapper sources (set -a) so a headless bot's shells see the tokens with no
  # dotfile read — `gh` gets GH_TOKEN/GITHUB_TOKEN, and the dynamic Linode
  # inventory gets LINODE_ACCESS_TOKEN to resolve production IPs. Both vaulted in
  # the repo (vars/main.yml), written in cleartext only here, into the bot's home.
  become: true
  no_log: true
  ansible.builtin.copy:
    dest: "{{ claude_user_home }}/.pat_tokens"
    owner: "{{ claude_user_name }}"
    group: "{{ claude_user_name }}"
    mode: "0600"
    content: |
      export GH_TOKEN={{ claude_user_gh_token }}
      export GITHUB_TOKEN={{ claude_user_gh_token }}
      export LINODE_ACCESS_TOKEN={{ claude_user_linode_token }}

- name: Source the token env file from the bot's .bashrc
  become: true
  become_user: "{{ claude_user_name }}"
  ansible.builtin.blockinfile:
    path: "{{ claude_user_home }}/.bashrc"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - pat_tokens"
    block: |
      if [ -f ~/.pat_tokens ]; then
        source ~/.pat_tokens
      fi

- name: Deploy the bot's git credential store
  # credential.helper=store reads this for https github.com auth, so `git`
  # works without relying on the shell having sourced GH_TOKEN.
  become: true
  no_log: true
  ansible.builtin.copy:
    dest: "{{ claude_user_home }}/.git-credentials"
    owner: "{{ claude_user_name }}"
    group: "{{ claude_user_name }}"
    mode: "0600"
    content: "https://x-access-token:{{ claude_user_gh_token }}@github.com\n"

# --- Launch path: sudoers + shell aliases -----------------------------------

- name: Allow the primary user to launch the bot as '{{ claude_user_name }}'
  become: true
  ansible.builtin.template:
    src: claude-bot-sudoers.j2
    dest: /etc/sudoers.d/claude-bot
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Ensure the primary user's ~/.config exists
  ansible.builtin.file:
    path: "{{ claude_user_primary_home }}/.config"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0755"

- name: Deploy the claude-bot shell alias fragment
  ansible.builtin.template:
    src: claude_bot.sh.j2
    dest: "{{ claude_user_primary_home }}/.config/claude-bot.sh"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0644"

- name: Source the claude-bot fragment from .bashrc
  # A sourced fragment keeps the aliases under management without reconciling
  # the hand-edited (drifted) .bashrc; sourced last, it overrides any stale
  # inline 'claude'/'bot' aliases still in the file.
  ansible.builtin.blockinfile:
    path: "{{ claude_user_primary_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - claude-bot"
    block: |
      if [ -f ~/.config/claude-bot.sh ]; then
        source ~/.config/claude-bot.sh
      fi

# --- Clipboard access for paste ---------------------------------------------
# Paste into the bot's terminal reads the X clipboard via 'xsel'. Under the
# isolated user that read fails (no Xwayland cookie) and Claude Code sees an
# empty clipboard, so nothing pastes. These tasks hand the bot a copy of the
# session cookie — a deliberate widening of the isolation model; see README.

- name: Ensure xsel is available for clipboard reads
  become: true
  ansible.builtin.package:
    name: xsel
    state: present

- name: Ensure the primary user's ~/.local/bin exists for the export hook
  ansible.builtin.file:
    path: "{{ claude_user_primary_home }}/.local/bin"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0755"

- name: Deploy the Xauthority export hook
  ansible.builtin.template:
    src: claude-bot-xauth-export.sh.j2
    dest: "{{ claude_user_primary_home }}/.local/bin/claude-bot-xauth-export"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0755"

- name: Ensure the primary user's autostart dir exists
  ansible.builtin.file:
    path: "{{ claude_user_primary_home }}/.config/autostart"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0755"

- name: Run the export hook at each graphical login
  # A desktop autostart entry (not a systemd user unit) so it runs inside the
  # graphical session where DISPLAY/XAUTHORITY are already set — the cookie path
  # rotates per login, so a one-shot copy would go stale.
  ansible.builtin.template:
    src: claude-bot-xauth.desktop.j2
    dest: "{{ claude_user_primary_home }}/.config/autostart/claude-bot-xauth.desktop"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0644"

# --- Rootless container engine (Podman) -------------------------------------
# The bot builds and runs containers rootless — inside its own user namespace —
# so a container escape or a `-v /:/host` mount only ever yields the 'claude'
# user's own privileges, the boundary already in force. The bot is never added
# to the 'docker' group: the docker socket is root-equivalent and would let it
# read/write the whole host, defeating the ACL isolation above. See README.

- name: Install Podman and its rootless dependencies
  become: true
  ansible.builtin.package:
    name:
      - podman
      - uidmap # newuidmap/newgidmap — set up the user-namespace mapping
      - fuse-overlayfs # rootless overlay storage driver
      - slirp4netns # rootless container networking
    state: present

- name: Reserve a subordinate uid/gid range for the bot's user namespace
  # Rootless Podman remaps container uids onto this range, so container 'root' is
  # {{ claude_user_subid_start }}, not host root. Managed explicitly rather than
  # left to useradd defaults so a fresh provision is reproducible; the '^claude:'
  # regexp corrects the range in place instead of appending a duplicate line.
  become: true
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    create: true
    owner: root
    group: root
    mode: "0644"
    regexp: "^{{ claude_user_name }}:"
    line: "{{ claude_user_name }}:{{ claude_user_subid_start }}:{{ claude_user_subid_count }}"
  loop:
    - /etc/subuid
    - /etc/subgid

- name: Enable systemd linger so the bot has a persistent runtime dir
  # Rootless Podman needs an XDG_RUNTIME_DIR. The headless bot has no login
  # session, so /run/user/<uid> would not otherwise exist; linger makes systemd
  # create and keep it, and the launch wrapper points XDG_RUNTIME_DIR there.
  # Without it Podman falls back to a /tmp runtime dir and hits storage-lock
  # churn across the bot's one-process-per-command shells.
  become: true
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ claude_user_name }}"
    creates: "/var/lib/systemd/linger/{{ claude_user_name }}"

- name: Give the bot a 'docker' command that maps to rootless Podman
  # The host's real 'docker' (docker-ce-cli, for the human's rootful engine) owns
  # /usr/bin/docker, so the system-wide podman-docker shim cannot be installed
  # without a file conflict. Drop the shim in the bot's own ~/.local/bin instead —
  # the launch wrapper prepends that to PATH — so build scripts calling 'docker'
  # reach Podman, and only for the bot; the human's docker is untouched.
  become: true
  ansible.builtin.copy:
    dest: "{{ claude_user_home }}/.local/bin/docker"
    owner: "{{ claude_user_name }}"
    group: "{{ claude_user_name }}"
    mode: "0755"
    content: |
      #!/bin/sh
      exec podman "$@"
