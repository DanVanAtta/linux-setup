---
# Deploys static dotfiles and wires ~/.bashrc to source ~/.pat_tokens. The
# content of ~/.pat_tokens is deliberately NOT managed here — 'just
# migrate-secrets' owns it (moves hardcoded values into the keyring, leaving
# 'export VAR=$(secret-tool lookup ...)' load lines). Ansible only guarantees
# the file gets sourced.

- name: Deploy dot files to home folder
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    backup: true
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0644"
  with_items:
    - src: vimrc
      dest: "{{ user_home }}/.vimrc"
    - src: bash_aliases
      dest: "{{ user_home }}/.bash_aliases"

- name: Ensure .bashrc sources .pat_tokens
  ansible.builtin.blockinfile:
    path: "{{ user_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
    block: |
      if [ -f ~/.pat_tokens ]; then
        source ~/.pat_tokens
      fi
