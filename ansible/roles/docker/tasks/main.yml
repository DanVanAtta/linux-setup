
- name: make sure older versions of docker are removed
  become: true
  package:
    state: absent
    name:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc

# Install instructions at: https://docs.docker.com/engine/install/ubuntu/

# 'signed_by' takes the key URL directly: deb822_repository downloads, dearmors,
# and embeds it inline in docker.sources, so no separate keyring file is needed.
- name: Add Docker apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [stable]
    architectures: "{{ ansible_facts['architecture'] | replace('x86_64', 'amd64') }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present
    enabled: true

# Drop the pre-deb822 artifacts; leaving docker.list alongside docker.sources
# makes apt warn the source is configured twice.
- name: Remove legacy Docker apt source and keyring superseded by deb822
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/keyrings/docker.gpg

- name: install docker packages
  become: true
  package:
    update_cache: true
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin

- name: create docker group
  become: true
  group:
    name: docker
    state: present

- name: sudoless docker commands
  become: true
  user:
    name: "{{ lookup('ansible.builtin.env', 'USER') }}"
    groups: docker
    append: yes
