---
- name: APT
  block:
    - name: Upgrade apt
      become: true
      when: not ansible_check_mode
      ansible.builtin.apt:
        cache_valid_time: 3600 ## one hour
        upgrade: true

    - name: Remove dependencies that are no longer required
      when: not ansible_check_mode
      become: true
      ansible.builtin.apt:
        autoremove: true

    - name: Install apt packages
      become: true
      when: not ansible_check_mode
      register: linux_apt_status
      ansible.builtin.package:
        state: present
        name:
          - bash-completion
          - ca-certificates
          - clamav
          - clamav-daemon
          - curl
          - dos2unix
          - expect
          - fail2ban
          - file-roller
          - gimp
          - gnupg
          - htop
          - iftop
          - libxml2-utils
          - lm-sensors
          - lsb-release
          - meld
          - nmap
          - npm
          - parallel
          - postgresql-client
          - preload
          - psensor
          - python3
          - python-is-python3
          - rar
          - rsyslog
          - ruby
          - ruby-dev
          - sharutils
          - shellcheck
          - snapd
          - traceroute
          - tree
          - unace
          - unrar
          - unzip
          - vim
          - whiptail
          - wget
          - zip

- name: Run sensors detect
  when: not ansible_check_mode and linux_apt_status.changed
  become: true
  ansible.builtin.command: sensors-detect --auto
  changed_when: true
- name: Snap Packages
  block:
    - name: Install snap packages
      when: not ansible_check_mode
      become: true
      notify: Snapd_running
      community.general.snap:
        name:
          - brave
          - steam

    - name: Make sure snapd is still present
      when: not ansible_check_mode
      become: true
      notify: Snapd_running
      ansible.builtin.package:
        state: present
        name: snapd

- name: Security Settings
  block:
    - name: Ensure firewall is running
      when: not ansible_check_mode
      become: true
      ansible.builtin.service:
        state: started
        name: ufw
        enabled: true
    - name: Disable kernel address visibility, disallowed to all users including root (kptr_restrict = 2)
      become: true
      ansible.builtin.copy:
        dest: /etc/sysctl.d/10-kernel-hardening.conf
        content: "kernel.kptr_restrict = 2\n"
        owner: root
        group: root
        mode: "0644"
      notify: Reload_sysctl

    - name: Disallow SSH password login
      ansible.builtin.replace:
        path: /etc/ssh/ssh_config
        regexp: "^#(.*PasswordAuthentication) .*"
        replace: "\\1 no"
      become: true
