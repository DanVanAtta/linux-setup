---
# Tracks upstream's default branch on first clone; `update: false` keeps it
# pinned thereafter, so tracking latest here is intentional.
- name: Clone scm_breeze repository
  ansible.builtin.git:  # noqa: latest[git]
    repo: git@github.com:scmbreeze/scm_breeze.git
    dest: "~/.scm_breeze"
    clone: true
    update: false

- name: Install scm_breeze
  ansible.builtin.command: ~/.scm_breeze/install.sh
  changed_when: true
